<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4f46e5" />
      <stop offset="50%" stopColor="#9333ea" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Background Grid/Orbit Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4" />

  <!-- Axes -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" />

  <!-- Trigonometric Right Triangle (Pitágoras / Razón Trigonométrica) -->
  <polygon points="170,350 360,350 360,160" fill="rgba(255, 255, 255, 0.12)" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Right Angle Symbol -->
  <rect x="326" y="316" width="34" height="34" fill="none" stroke="#f59e0b" stroke-width="4" />
  <circle cx="343" cy="333" r="4" fill="#f59e0b" />

  <!-- Radiant Sine Wave Arc -->
  <path d="M 90 256 Q 170 120 256 256 T 422 256" fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Theta (θ) Symbol & Core Nodes -->
  <circle cx="170" cy="350" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="360" cy="160" r="14" fill="#f43f5e" stroke="#ffffff" stroke-width="4" />
  <circle cx="360" cy="350" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />

  <!-- Sparkling North Star / Kepler Beacon -->
  <path d="M 256 90 Q 256 120 286 120 Q 256 120 256 150 Q 256 120 226 120 Q 256 120 256 90 Z" fill="#ffffff" filter="url(#glow)" />
</svg>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Trigonométrica - Una Aventura de Aprendizaje</title>
    <meta name="description" content="Aplicación educativa interactiva para explorar trigonometría, geometría y matemáticas con sentido humano y rigor pedagógico.">
    
    <!-- PWA Primary Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <meta name="theme-color" content="#9333ea">
    
    <!-- iOS Web App support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trigonométrica">
    <meta name="format-detection" content="telephone=no">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-purple: #9333ea;
            --neon-blue: #2563eb;
            --neon-cyan: #06b6d4;
            --deep-navy: #0f172a;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(147, 51, 234, 0.1) 1px, transparent 0);
            background-size: 32px 32px;
            color: var(--deep-navy);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .math-font {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        .glass-vibrant {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 2px solid #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .blackboard-pro {
            background: #064e3b;
            border: 12px solid #3f1a01;
            box-shadow: 
                inset 0 0 60px rgba(0,0,0,0.7),
                0 20px 40px rgba(0,0,0,0.2),
                0 0 0 4px #5c2d06;
            border-radius: 12px;
            position: relative;
        }
        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.4);
        }
        .neon-text-purple { color: #7e22ce; }
        .neon-text-blue { color: #1d4ed8; }
        .neon-text-cyan { color: #0891b2; }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 32px 32px; }
        }
        .bg-animate {
            animation: drift 10s linear infinite;
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, #9333ea, #2563eb); 
            border-radius: 10px;
            border: 3px solid #f1f5f9;
        }

        /* Hologram Effects */
        @keyframes wavePulse {
            0% { opacity: 0.4; transform: scale(1) translateY(0); }
            50% { opacity: 0.8; transform: scale(1.02) translateY(-5px); }
            100% { opacity: 0.4; transform: scale(1) translateY(0); }
        }
        .hologram-wave {
            animation: wavePulse 4s ease-in-out infinite;
        }
        @keyframes riseUp {
            0% { transform: translateY(20px) scale(0.8); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: translateY(-150px) scale(1.3); opacity: 0; }
        }
        .rise-sine {
            animation: riseUp 5s ease-out infinite;
        }
        .rise-tangent {
            animation: riseUp 7s ease-out infinite;
            animation-delay: 2s;
        }
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .orbit-container {
            will-change: transform;
        }
        @keyframes flashEffect {
            0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 5px rgba(34, 211, 238, 0.8)); }
            30% { transform: scale(2.2); filter: brightness(2.5) drop-shadow(0 0 25px rgba(253, 224, 71, 1)); }
            60% { transform: scale(1.8); filter: brightness(2) drop-shadow(0 0 20px rgba(249, 115, 22, 1)); }
            100% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 10px rgba(34, 211, 238, 0.8)); }
        }
        .planet-flash {
            animation: flashEffect 0.8s ease-out forwards;
        }
        @keyframes shockwave {
            0% { transform: scale(0.6); opacity: 1; border-width: 3px; }
            100% { transform: scale(3.5); opacity: 0; border-width: 1px; }
        }
        .planet-shockwave {
            animation: shockwave 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        .shadow-glow-cyan {
            filter: drop-shadow(0 0 15px rgba(34, 211, 238, 1));
        }
        .shadow-glow-purple {
            filter: drop-shadow(0 0 15px rgba(147, 51, 234, 1));
        }
        .shadow-glow-amber {
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 1));
        }
    </style>
